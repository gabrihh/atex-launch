<!DOCTYPE html> 
<html>
<head>
<meta charset="UTF-8">
<title></title>
<style>
  body {
    margin: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background-color: #1a1f27;
    font-family: "Roboto", sans-serif;
  }
  h1 {
    color: #3b82f6;
    font-size: 3em;
  }
</style>
</head>
<body>
<script>
async function start() {
  try {
    const maint = (await (await fetch('maintence.txt')).text()).trim();
    const feature = (await (await fetch('newFeatureTest.txt')).text()).trim();

    const hasFeature = feature.length > 0;

    let androidHasFeature = false;

    if (hasFeature && window.AndroidBridge?.getSupportedFeatures) {
      try {
        androidHasFeature =
          AndroidBridge.getSupportedFeatures().includes(feature);
      } catch (e) {
        androidHasFeature = false;
      }
    }

    if (!hasFeature) {
      if (maint === "1") {
        document.body.innerHTML = "<h1>Maintenance</h1>";
        return;
      }

      location.replace("https://atexlive.web.app/auth");
      return;
    }

    if (androidHasFeature) {
      location.replace("https://atexlive.web.app/auth");
      return;
    }

    document.body.innerHTML = "<h1>Maintenance</h1>";
  } catch (e) {
    location.replace("https://atexlive.web.app/auth");
  }
}

start();
  </script>
</body>
</html>
